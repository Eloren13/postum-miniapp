name: Keep Render app awake

# Пингует /health каждые 5 минут, чтобы бесплатный сервис на Render
# не "засыпал" из-за отсутствия входящих запросов (тайм-аут Render — 15 минут).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}  # позволяет запустить вручную во вкладке Actions

env:
  APP_URL: https://postum-miniapp.onrender.com/health

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Пингую $APP_URL"
          curl -sf --max-time 20 "$APP_URL" && echo "OK" || echo "Пинг не удался (сервис мог ещё не проснуться, это нормально для первого запроса)"
